version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-http-header-size=16384
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ${COMMAND:-npm start}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge 